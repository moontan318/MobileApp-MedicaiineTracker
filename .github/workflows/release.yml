name: Release APK

on:
  push:
    tags:
      - "v*"
    branches:
      - main
      - claude/vibrant-hopper-qwzlch
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run interaction engine tests
        run: ./gradlew :core:test

      - name: Build APK
        run: ./gradlew :app:assembleDebug

      - name: Work out version tag
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "MedicineTracker-${{ steps.version.outputs.tag }}.apk"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Medicine Tracker ${{ steps.version.outputs.tag }}
          files: MedicineTracker-${{ steps.version.outputs.tag }}.apk
          overwrite_files: true
          body: |
            Android APK for Medicine Tracker (Android 8.0+).

            **Install:** download `MedicineTracker-${{ steps.version.outputs.tag }}.apk` on your phone, open it, and allow
            "Install unknown apps" for your browser or file manager when prompted.

            This build is signed with a development key, so it is for sideloading rather than the Play Store.
            If you install a later version signed with a different key you may need to uninstall this one first.

            This app is an information aid, not medical advice. Always check with a doctor or pharmacist
            before changing or stopping a medicine.
